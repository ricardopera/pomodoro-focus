name: Build and Release

permissions:
  contents: write
  issues: write
  pull-requests: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      version_number: ${{ steps.get_version.outputs.version_number }}
    steps:
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Remove 'v' prefix for version number (v1.0.0 -> 1.0.0)
          VERSION_NUMBER="${VERSION#v}"
          echo "version_number=$VERSION_NUMBER" >> $GITHUB_OUTPUT

  build-windows:
    needs: get-version
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows executables
        run: npm run build:prod && npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify executable
        shell: pwsh
        run: |
          Write-Host "Checking executable..."
          $exePath = "release\win-unpacked\Pomodoro Focus.exe"
          if (Test-Path $exePath) {
            Write-Host "Found: $exePath"
            $fileInfo = Get-Item $exePath
            Write-Host "Size: $($fileInfo.Length) bytes"
          } else {
            Write-Host "Not found: $exePath"
          }

      - name: List release files
        run: |
          Get-ChildItem release -Recurse | Select-Object FullName
        shell: powershell

      - name: Upload Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: release/*.exe
          retention-days: 1

