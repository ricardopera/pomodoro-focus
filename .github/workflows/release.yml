  create-release:
    needs: [get-version, build-windows] #, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: release/

      # - name: Download Linux artifacts
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: linux-artifacts
      #     path: release/

      # - name: Download macOS artifacts
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: macos-artifacts
      #     path: release/

      - name: List all artifacts
        run: ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: 🍅 Pomodoro Focus ${{ needs.get-version.outputs.version }}
          body: |
            ## 🍅 Pomodoro Focus ${{ needs.get-version.outputs.version }}

            Um Pomodoro para desktop feito para uma coisa só: você trabalhar 25 minutos
            sem ser interrompido — e saber depois no que esse tempo foi gasto.

            #### ⏱️ A técnica completa

            - Foco, pausa curta e pausa longa com durações configuráveis (25 / 5 / 15 por padrão)
            - Pausa longa automática a cada N sessões, com os pontinhos do ciclo abaixo do relógio
            - Início automático de pausas e/ou do próximo foco, pausar, reiniciar, pular e +5 minutos
            - Relógio ancorado no horário real: não atrasa em segundo plano nem depois de suspender
              o computador, e uma sessão em andamento é retomada se você fechar e reabrir o app

            #### ✍️ Cada sessão tem nome e descrição

            - Campo "No que você está trabalhando?" com sugestões dos nomes já usados
            - Descrição opcional para o objetivo ou o próximo passo, editável depois no histórico
            - Tarefas com estimativa de pomodoros: focar em uma preenche a sessão e sobe o contador
            - Estatísticas mostram **onde o seu foco foi parar**, agrupado pelo nome das sessões

            #### 🌙 Sem distrações

            - Janela sem moldura do sistema, com o tempo restante como única coisa em destaque
            - Durante o foco a interface escurece e só o relógio permanece
            - Modo compacto sempre à frente, bandeja do sistema, notificações nativas e barra de
              progresso na barra de tarefas
            - Sons sintetizados (sinos suaves, tique-taque opcional) e quatro temas

            #### 🔒 Seus dados são seus

            Tudo fica em um arquivo JSON dentro da pasta do usuário
            (`%APPDATA%\Pomodoro Focus\pomodoro-data.json`). O app não faz nenhuma requisição
            de rede — sem conta, sem telemetria, sem sincronização.

            #### 📥 Downloads (Windows x64)

            - `PomodoroFocus-Setup-${{ needs.get-version.outputs.version_number }}.exe` — instalador (recomendado)
            - `PomodoroFocus-Portable-${{ needs.get-version.outputs.version_number }}.exe` — versão portátil, sem instalação

            #### 📝 Notas

            - O executável não é assinado digitalmente: na primeira execução o SmartScreen pode
              pedir "Mais informações" → "Executar assim mesmo"
            - Atalhos: `Espaço` inicia/pausa · `R` reinicia · `S` pula · `M` modo compacto ·
              `1` `2` `3` alternam entre foco, pausa curta e pausa longa
          draft: false
          prerelease: false
          files: |
            release/*
          token: ${{ secrets.GITHUB_TOKEN }}
